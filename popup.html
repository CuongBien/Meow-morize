<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meow-morize Popup</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.08);
      --success: #10b981;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      width: 290px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }

    .logo h2 {
      font-size: 17px;
      font-weight: 700;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      background-color: var(--border);
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .status-badge.connected {
      background-color: rgba(16, 185, 129, 0.08);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    /* Toggle switch group */
    .control-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .control-label {
      font-size: 13px;
      font-weight: 600;
    }

    .control-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .25s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Actions */
    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow);
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="icons/icon48.png" alt="Meow-morize Logo">
      <h2>Meow-morize</h2>
    </div>
    <span class="status-badge" id="notion-status">Notion Off</span>
  </div>

  <div class="control-card">
    <div>
      <div class="control-label">Select to Translate</div>
      <div class="control-desc">Show translator icon on text selection</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="extension-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button class="btn" id="btn-open-options">
    <svg viewBox="0 0 24 24">
      <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 14.5c-3.04 0-5.5-2.46-5.5-5.5S8.96 6.5 12 6.5s5.5 2.46 5.5 5.5-2.46 5.5-5.5 5.5z"/>
    </svg>
    Open Word Book
  </button>

  <div class="footer">
    Highlight any word to start learning!
  </div>

  <script src="popup.js"></script>
</body>
</html>
